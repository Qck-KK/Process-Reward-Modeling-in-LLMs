name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    # CPU only: the unit tests need torch (and numpy), nothing that downloads
    # a model. The end-to-end smoke test is not run here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy==2.5.5"
      - name: Byte-compile
        run: python -m py_compile *.py analysis/*.py eval/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -v
